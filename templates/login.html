<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Connexion — SimuPrime</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="login-page">
  <div class="bg-blobs"><span></span><span></span><span></span></div>

  <main class="login-wrap">
    <div class="login-card" id="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#22d3ee"/>
          </linearGradient></defs>
          <rect width="64" height="64" rx="16" fill="url(#lg)"/>
          <circle cx="32" cy="26" r="13" fill="#fff"/>
          <text x="32" y="31" text-anchor="middle" font-family="Arial" font-size="14"
                font-weight="800" fill="#1e4fd6">Ar</text>
          <path d="M17 47h30" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="login-title">SimuPrime</h1>
      <p class="login-sub">Calculateur de prime de régularité — veuillez vous connecter
         pour accéder à l'application.</p>

      <div class="role-grid">
        <button type="button" class="role-card selected" data-role="user">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>
          </svg>
          <span class="role-name">Utilisateur</span>
          <span class="role-desc">Consultation &amp; simulation</span>
        </button>
        <button type="button" class="role-card" data-role="admin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>
          </svg>
          <span class="role-name">Admin</span>
          <span class="role-desc">Gestion complète</span>
        </button>
      </div>

      <div class="field pwd-field hidden" id="pwd-field">
        <label for="admin-password">Mot de passe administrateur</label>
        <input type="password" id="admin-password" autocomplete="current-password"
               placeholder="••••••••"/>
      </div>

      <p class="login-error hidden" id="login-error"></p>
      <button class="btn btn-accent btn-block btn-lg" id="btn-login">Se connecter</button>
    </div>
    <p class="login-footer">Outil interne — accès réservé aux collaborateurs</p>
  </main>

  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<footer class="footer-fix">Developped by <span>RAVO SERGIO</span></footer>
</body>
</html>
